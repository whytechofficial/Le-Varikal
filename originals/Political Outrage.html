    {
        "title": "WHY POLITICAL OUTRAGE IS ADDICTIVE",
        "paragraphs": [
            "Political outrage is not merely anger. It is moral anger, and that distinction matters.",
            "Psychologist Jonathan Haidt argues that moral emotions evolved to regulate collective life. When we perceive violations of fairness, harm, loyalty, or authority, outrage functions as a social alarm system. It signals that a boundary has been crossed and that the group must respond.",
            "In this sense, outrage is not a breakdown of reason but an adaptive response designed to preserve moral order. It binds communities together by clearly identifying what is unacceptable.",
            "However, moral outrage not only regulates behaviour; it also feels rewarding. Expressions of righteous anger activate the brain's reward circuitry, particularly when they are met with affirmation from others. Each like, repost, or public agreement provides a small but meaningful reinforcement signal.",
            "The brain begins to associate moral expression with social reward. Over time, outrage is not simply expressed because something is wrong. It is expressed because it produces recognition, validation, and a sense of belonging. The emotional satisfaction becomes inseparable from the moral stance.",
            "Legal scholar Cass Sunstein has shown that when like-minded individuals deliberate together, their views tend to become more extreme rather than more moderate. This phenomenon, known as group polarisation, demonstrates that shared outrage rarely stabilises at a fixed intensity. Instead, each expression subtly shifts the group's emotional baseline.",
            "What once seemed excessive gradually appears insufficient. The collective mood intensifies, and moderation begins to look like indifference. In such environments, outrage is escalated.",
            "Digital platforms did not invent moral outrage, but they have perfected its circulation. Content that triggers strong emotional arousal spreads more rapidly than content that requires patience or nuance. Anger, in particular, generates higher engagement metrics, which algorithms interpret as value.",
            "The system is structurally indifferent to the epistemic quality of content; it rewards attention, not accuracy. As a result, outrage becomes algorithmically privileged. What feels like spontaneous moral expression is often operating within an incentive structure that amplifies intensity over reflection.",
            "Outrage also provides psychological relief in a complex and unstable political world. It simplifies ambiguity by dividing reality into clear moral categories. In moments of uncertainty, such clarity feels stabilising. Yet as Hannah Arendt warned, the erosion of reflective judgment weakens democratic life.",
            "Political thinking requires the capacity to hold competing truths, to tolerate contradiction, and to resist immediate moral finality. Outrage offers certainty, but certainty can become a substitute for thought.",
            "In contemporary politics, belief has become increasingly fused with identity. Political affiliation signals who we are, what we value, and where we belong. When criticism targets our ideological group, the threat is experienced not only as intellectual disagreement but as personal attack.",
            "Expressing outrage becomes a way of demonstrating loyalty and reinforcing group solidarity. Over time, anger functions as proof of commitment. The absence of visible outrage can be interpreted as moral weakness or insufficient allegiance.",
            "The deeper concern is not that outrage exists, because outrage can be morally justified and historically necessary. The concern is that when outrage becomes psychologically rewarding, socially incentivised, and structurally amplified, it risks reshaping democratic culture itself.",
            "Democracy requires tolerance for complexity, patience with disagreement, and the ability to distinguish between opposition and evil.",
            "If political engagement becomes dependent on emotional escalation, compromise feels like betrayal, and nuance looks like complicity. The question, then, is not whether outrage is legitimate. It is whether we are gradually being conditioned to need it to feel politically alive."
        ]
    }
    </script>

    <script>
        // 1. Parse JSON and Render Content
        const jsonString = document.getElementById('article-data').textContent;
        const articleObj = JSON.parse(jsonString);
        
        // Add Title
        const headerDiv = document.getElementById('article-header');
        const titleElement = document.createElement('h1');
        titleElement.textContent = articleObj.title;
        headerDiv.appendChild(titleElement);
        
        // Setup Date
        const dateElement = document.getElementById('current-date');
        const today = new Date();
        dateElement.textContent = today.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
        
        // Add Paragraphs
        const contentDiv = document.getElementById('article-content');
        const articleTextContainer = document.createElement('div');
        articleTextContainer.className = 'container';
        contentDiv.appendChild(articleTextContainer);
        
        articleObj.paragraphs.forEach(paragraphText => {
            const pElement = document.createElement('p');
            pElement.textContent = paragraphText;
            articleTextContainer.appendChild(pElement);
        });

        // 2. Share Functions
        function getShareData() {
            return {
                url: window.location.href,
                title: document.title
            };
        }

        function shareToX() {
            const data = getShareData();
            window.open(`https://twitter.com/intent/tweet?url=${encodeURIComponent(data.url)}&text=${encodeURIComponent(data.title)}`, '_blank');
        }

        function shareToFacebook() {
            const data = getShareData();
            window.open(`https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(data.url)}`, '_blank');
        }

        function shareToWhatsApp() {
            const data = getShareData();
            window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(data.title + " " + data.url)}`, '_blank');
        }

        function copyLink(buttonElement) {
            const data = getShareData();
            navigator.clipboard.writeText(data.url).then(() => {
                buttonElement.classList.add('copied');
                setTimeout(() => {
                    buttonElement.classList.remove('copied');
                }, 2000);
            });
        }

        // 3. Scroll-Triggered Fade-In Animation
        const paragraphs = document.querySelectorAll('.container p');
        const observerOptions = {
            root: null,
            rootMargin: '0px 0px -50px 0px',
            threshold: 0.1 
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                }
            });
        }, observerOptions);

        paragraphs.forEach(p => observer.observe(p));

        // 4. Smooth Reading Progress Bar Logic
        const progressBar = document.getElementById("progressBar");
        const updateProgressBar = () => {
            let winScroll = document.documentElement.scrollTop;
            let height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            let scrolled = (winScroll / height) * 100;
            progressBar.style.width = scrolled + "%";
        };

        window.addEventListener('scroll', updateProgressBar);
        updateProgressBar();
    </script>
